services:
  asmx:
    build:
      context: .
      dockerfile: Dockerfile
    image: asmx:dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./samples:/app/samples:ro
      - ./results:/app/results
      # - /tmp/.X11-unix:/tmp/.X11-unix   # GUI mode (Linux hosts)
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ASMX_LOG_JSON: "${ASMX_LOG_JSON:-0}"
      # DISPLAY: "${DISPLAY}"              # GUI mode (Linux hosts)
    # Override-friendly: `docker compose run --rm asmx run file.asm`
    command: ["info"]

  # Quality gate: `docker compose --profile test run --rm asmx-test`
  asmx-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    image: asmx:test
    init: true
    working_dir: /app
    volumes:
      - ./samples:/app/samples:ro
      - ./results:/app/results
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      ASMX_LOG_JSON: "${ASMX_LOG_JSON:-0}"
    command: ["quality"]
