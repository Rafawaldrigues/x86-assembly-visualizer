<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="478" height="206" viewBox="0 0 478 206" role="img" aria-label="Grafo de chamadas">
  <title>Grafo de chamadas</title>
  <defs>
    <marker id="asmx-calls-dark-edge_call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a795f2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="478" height="206" fill="#0f1420"/>
  <g class="arestas">
    <path d="M 121 82 L 121 121" fill="none" stroke="#a795f2" stroke-width="1.6" stroke-linecap="round" marker-end="url(#asmx-calls-dark-edge_call)"/>
    <path d="M 188.4 82 L 286.8 122.8" fill="none" stroke="#a795f2" stroke-width="1.6" stroke-linecap="round" marker-end="url(#asmx-calls-dark-edge_call)"/>
  </g>
  <g class="nos">
    <g class="no no-entry">
      <title>_start: nenhuma chamada recebida</title>
      <rect x="26" y="26" width="190" height="56" rx="9" fill="#16452f" stroke="#3a4a63" stroke-width="1.5"/>
      <text x="121" y="50.9" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#e8eef8">_start</text>
      <text x="121" y="66.4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#93a3ba">nenhuma chamada recebida</text>
    </g>
    <g class="no no-function">
      <title>soma: chamada 1×</title>
      <rect x="26" y="124" width="190" height="56" rx="9" fill="#22314b" stroke="#3a4a63" stroke-width="1.5"/>
      <text x="121" y="148.9" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#e8eef8">soma</text>
      <text x="121" y="164.4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#93a3ba">chamada 1×</text>
    </g>
    <g class="no no-function">
      <title>itoa: chamada 1×</title>
      <rect x="262" y="124" width="190" height="56" rx="9" fill="#22314b" stroke="#3a4a63" stroke-width="1.5"/>
      <text x="357" y="148.9" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#e8eef8">itoa</text>
      <text x="357" y="164.4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#93a3ba">chamada 1×</text>
    </g>
  </g>
  <g class="rotulos">
    <rect x="112" y="92.5" width="18.1" height="13" rx="4" fill="#0f1420" fill-opacity="0.82"/>
    <text x="121" y="101.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a795f2">1×</text>
    <rect x="228.6" y="93.4" width="18.1" height="13" rx="4" fill="#0f1420" fill-opacity="0.82"/>
    <text x="237.6" y="102.4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a795f2">1×</text>
  </g>
</svg>
