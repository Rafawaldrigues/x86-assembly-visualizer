<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160"
     role="img" aria-labelledby="asmxLogoTitle">
  <title id="asmxLogoTitle">ASM X — assembly x86-64, entender antes de rodar</title>

  <defs>
    <linearGradient id="asmxPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202E"/>
      <stop offset="1" stop-color="#121B28"/>
    </linearGradient>
    <linearGradient id="asmxRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3A44B" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#E3A44B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E3A44B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="asmxRound">
      <rect x="0.5" y="0.5" width="639" height="159" rx="14"/>
    </clipPath>
  </defs>

  <!-- painel: mesmas cores do tema escuro da interface -->
  <g clip-path="url(#asmxRound)">
    <rect x="0.5" y="0.5" width="639" height="159" rx="14" fill="url(#asmxPanel)"/>
    <g stroke="#57C8D2" stroke-width="1" opacity="0.045">
      <line x1="0" y1="40.5" x2="640" y2="40.5"/>
      <line x1="0" y1="80.5" x2="640" y2="80.5"/>
      <line x1="0" y1="120.5" x2="640" y2="120.5"/>
    </g>
    <g stroke="#8AA0B8" stroke-width="1" opacity="0.04">
      <line x1="160.5" y1="0" x2="160.5" y2="160"/>
      <line x1="320.5" y1="0" x2="320.5" y2="160"/>
      <line x1="480.5" y1="0" x2="480.5" y2="160"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="639" height="159" rx="14" fill="none" stroke="#26394E"/>

  <!-- marca: registradores empilhados, um deles sob a lente -->
  <g>
    <g fill="#57C8D2" opacity="0.45">
      <rect x="62" y="76" width="60" height="9" rx="2"/>
      <rect x="62" y="90" width="60" height="9" rx="2"/>
      <rect x="62" y="104" width="60" height="9" rx="2"/>
      <rect x="62" y="132" width="60" height="9" rx="2"/>
      <rect x="62" y="146" width="60" height="9" rx="2"/>
    </g>
    <rect x="62" y="118" width="60" height="9" rx="2" fill="#E3A44B"/>

    <circle cx="128" cy="122" r="27" fill="none" stroke="#57C8D2" stroke-width="5"/>
    <line x1="147" y1="141" x2="161" y2="155" stroke="#57C8D2" stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="218" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="46" font-weight="700" fill="#DCE6F2" letter-spacing="2">ASM X</text>
  <rect x="220" y="100" width="252" height="4" rx="2" fill="url(#asmxRule)"/>
  <text x="220" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="12.5" fill="#8AA0B8" letter-spacing="1">assembly x86-64 &#183; entender antes de rodar</text>
</svg>
