# ASM X — pre-commit hooks.
#
#   pip install -r requirements-dev.txt
#   pre-commit install
#   pre-commit run --all-files
#
# The versions below are the same ones CI installs, so a green local run is a
# good predictor of a green build.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: ["--line-length", "100"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        files: ^(asmx|tests|tools)/.*\.py$|^asmx\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^asmx/

  # The two gates behind the promise of "100% type hints and Google-style
  # docstrings", plus the guarantee that examples/*.asm stays identical to the
  # collection embedded in asmx/examples.py.
  - repo: local
    hooks:
      - id: asmx-quality-gates
        name: quality gates (type hints and docstrings)
        entry: python tools/quality_gates.py
        language: system
        pass_filenames: false
        files: ^(asmx|tests|tools)/.*\.py$|^asmx\.py$
      - id: asmx-examples-sync
        name: examples in examples/ identical to the ones in the package
        entry: python tools/export_examples.py --check
        language: system
        pass_filenames: false
        files: ^(asmx/examples\.py|examples/.*\.asm)$
