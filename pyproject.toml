[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asmx"
dynamic = ["version"]
description = "x86-64 assembly source viewer and teaching simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ASM X contributors" }]
keywords = [
    "assembly",
    "x86-64",
    "asm",
    "nasm",
    "emulator",
    "debugger",
    "linter",
    "tkinter",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]
# ASM X is standard-library only — this list stays empty on purpose.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "coverage[toml]>=7.16.2",
    "mypy>=2.3.1",
    "flake8>=7.4.1",
    "black>=26.5.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "build>=1.6.1",
]

[project.scripts]
asmx = "asmx.cli:main"
asmx-gui = "asmx.ui:main"

[project.urls]
Homepage = "https://github.com/Rafawaldrigues/x86-assembly-visualizer"
Repository = "https://github.com/Rafawaldrigues/x86-assembly-visualizer"
Issues = "https://github.com/Rafawaldrigues/x86-assembly-visualizer/issues"
Documentation = "https://github.com/Rafawaldrigues/x86-assembly-visualizer/tree/main/docs"
Changelog = "https://github.com/Rafawaldrigues/x86-assembly-visualizer/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["asmx", "asmx.ui"]
# Data files are declared explicitly below, so nothing is pulled in by a
# MANIFEST.in or by version-control bookkeeping.
include-package-data = false

[tool.setuptools.dynamic]
# NB: `asmx.__init__.__version__` (not `asmx.__version__`).  With the flat
# layout, setuptools' attribute resolver looks for `<root>/asmx.py` before
# `<root>/asmx/__init__.py`, so the short form would import the `asmx.py`
# launcher instead of the package and fail.  The dotted `__init__` form points
# straight at `asmx/__init__.py`, so the version really is read from there.
version = { attr = "asmx.__init__.__version__" }

[tool.setuptools.package-data]
asmx = ["data/*.json", "data/rules/*.json"]

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = '''
/(
    build
  | dist
  | \.venv
  | venv
)/
'''

# NOTE: flake8 does not read pyproject.toml by itself.  CI, pre-commit and the
# Makefile pass these values as command-line flags; install the
# `Flake8-pyproject` plugin (`pip install Flake8-pyproject`) if you want
# `flake8` to pick this section up automatically.
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
max-complexity = 45

[tool.mypy]
# No fixed `python_version` on purpose: new mypy versions refuse old targets
# (3.9), and the real compatibility with each Python version is checked by the
# CI matrix, which runs the suite on 3.9, 3.10, 3.11, 3.12 and 3.13.
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["build", "dist", "\\.venv"]

# Analysis fields are populated in stages; these checks cannot narrow them yet.
[[tool.mypy.overrides]]
module = ["asmx.analyzer", "asmx.emulator", "asmx.linter"]
disable_error_code = ["union-attr", "arg-type", "index", "operator", "attr-defined", "assignment"]

# The Tkinter interface passes state between methods (`self.analysis`,
# `self.machine`) and the widgets are dynamic, so the Tk stubs do not describe
# what the code guarantees at runtime.
[[tool.mypy.overrides]]
module = ["asmx.ui.*"]
disable_error_code = ["union-attr", "arg-type", "index", "operator", "attr-defined", "call-arg", "assignment", "var-annotated", "misc"]

[tool.coverage.run]
branch = true
source = ["asmx"]

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
